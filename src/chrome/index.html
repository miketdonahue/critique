<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>critique</title>
    <script>
      // Apply an explicit theme before first paint to avoid a flash.
      try {
        var sel = localStorage.getItem("critique:theme");
        var dark = sel === "dark" || ((sel === "system" || !sel) && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
